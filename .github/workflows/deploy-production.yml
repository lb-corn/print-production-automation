name: Lucky Bags Secure Production Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lucky-bags-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  security:
    name: Security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check tracked files and high-risk code
        run: |
          python3 - <<'PY'
          """Fail closed on dangerous tracked files and a small set of high-risk source patterns."""
          from pathlib import Path
          import re
          import subprocess
          import sys

          ROOT = Path.cwd()


          def forbidden(path):
              name = path.lower().replace('\\', '/')
              base = name.rsplit('/', 1)[-1]
              return (
                  base == '.env' or (base.startswith('.env.') and base != '.env.example')
                  or base in {'tasks.json', 'fa-solid-300.llf', 'fa-solid-500.woff2', 'fa-solid.lfk', 'credentials.json', 'token.json'}
                  or (base.startswith('service-account') and base.endswith('.json'))
                  or name.startswith(('vendor/', 'node_modules/'))
                  or (name.startswith('database/') and (name.endswith('.sqlite') or '.sqlite-' in name))
                  or base.endswith(('.pem', '.p12', '.pfx'))
              )


          def main():
              paths = subprocess.check_output(['git', 'ls-files', '-z'], cwd=ROOT).decode().split('\0')
              bad = [path for path in filter(None, paths) if forbidden(path)]
              modes = subprocess.check_output(['git', 'ls-files', '-s'], cwd=ROOT).decode().splitlines()
              bad.extend(line.split('\t', 1)[-1] for line in modes if line.startswith('120000 '))
              if bad:
                  raise SystemExit('BLOCKED tracked files or links:\n' + '\n'.join(bad))
              patterns = [r'eval\s*\(\s*base64_decode', r'base64_decode\s*\(.*(?:eval|assert)',
                          r'child_process.{0,80}(?:exec|spawn)', r'curl\s+[^\n|]{0,200}\|\s*(?:bash|sh)',
                          r'file_put_contents\s*\(\s*[\'\"](?:\.htaccess|\.user\.ini)']
              hits = []
              for directory in ['app', 'bootstrap', 'public', 'resources', 'routes', 'automation', 'deployment']:
                  for path in (ROOT / directory).rglob('*'):
                      # Check tracked source only: local virtualenvs/runtime files must never enter the gate/package.
                      relative = path.relative_to(ROOT).as_posix()
                      if relative not in paths or not path.is_file() or path.suffix.lower() not in {'.php','.js','.mjs','.cjs','.sh','.py','.ps1'}:
                          continue
                      data = path.read_text(encoding='utf-8-sig')
                      for pattern in patterns:
                          if re.search(pattern, data, re.I | re.S): hits.append(f'{relative}: {pattern}')
              if hits:
                  raise SystemExit('Security review required:\n' + '\n'.join(hits))
              print('Tracked-file and high-risk-pattern gates passed. This is not a malware-free guarantee.')


          if __name__ == '__main__':
              main()
          PY
      - name: ClamAV source scan
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --recursive --infected --no-summary --exclude-dir='(^|/)\.git(/|$)' .

  validate:
    name: Laravel validation
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup PHP from Ubuntu packages
        run: |
          set -euo pipefail
          if ! /usr/bin/php8.3 -r 'foreach (["mbstring","openssl","pdo_sqlite","sqlite3","xml","ctype","fileinfo","curl","zip"] as $e) { if (!extension_loaded($e)) exit(1); }' 2>/dev/null || ! command -v composer >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y php8.3-cli php8.3-mbstring php8.3-sqlite3 php8.3-xml php8.3-curl php8.3-zip composer
          fi
          sudo update-alternatives --set php /usr/bin/php8.3
          php -r 'exit(PHP_VERSION_ID >= 80300 && PHP_VERSION_ID < 80400 ? 0 : 1);'
          php -r 'foreach (["mbstring","openssl","pdo_sqlite","sqlite3","xml","ctype","fileinfo"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing PHP extension: ".$extension.PHP_EOL); exit(1); } }'
          composer --version
      - name: Validate and audit dependencies
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          composer audit --locked
      - name: Check Laravel bootstrap, routes and views
        run: |
          set -euo pipefail
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          cp .env.example .env
          php artisan key:generate
          php artisan about
          php artisan route:list
          php artisan view:cache
          php artisan view:clear
      - name: Run application regression checks
        run: php tests/bulk-review.php
      - name: Validate post-deployment shell script
        run: bash -n deployment/post-deploy.sh

  deploy:
    name: Deploy to HostGator
    needs: [security, validate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup PHP from Ubuntu packages
        run: |
          set -euo pipefail
          if ! /usr/bin/php8.3 -r 'foreach (["mbstring","openssl","pdo_sqlite","sqlite3","xml","ctype","fileinfo","curl","zip"] as $e) { if (!extension_loaded($e)) exit(1); }' 2>/dev/null || ! command -v composer >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y php8.3-cli php8.3-mbstring php8.3-sqlite3 php8.3-xml php8.3-curl php8.3-zip composer
          fi
          sudo update-alternatives --set php /usr/bin/php8.3
          php -r 'exit(PHP_VERSION_ID >= 80300 && PHP_VERSION_ID < 80400 ? 0 : 1);'
          php -r 'foreach (["mbstring","openssl","pdo_sqlite","sqlite3","xml","ctype","fileinfo"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing PHP extension: ".$extension.PHP_EOL); exit(1); } }'
          composer --version
      - name: Require existing deployment credentials
        env:
          FTP_SERVER: ${{ secrets.PROD_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
      - name: Build production dependencies and deployment package
        run: |
          set -euo pipefail
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          python3 - <<'PY'
          """Create an allowlisted Laravel web-server package without local data or factory-PC tools."""
          from pathlib import Path
          import shutil

          ROOT = Path.cwd()
          TARGET = ROOT / '.deploy'
          ALLOW = ['app','bootstrap','config','database/migrations','database/seeders','public','resources','routes','vendor','deployment',
                   'artisan','composer.json','composer.lock']


          def excluded(relative):
              parts = relative.parts
              name = relative.name.lower()
              return (name.startswith('.env') or name.startswith('service-account') or name in {'credentials.json','token.json','.htaccess'}
                      or name.endswith(('.sqlite','.log','.pem','.p12','.pfx','.pyc')) or '.sqlite-' in name
                      or any(part in {'.git','__pycache__','.venv','node_modules'} for part in parts)
                      or (parts[:2] == ('bootstrap','cache') and name.endswith('.php')))


          def main():
              if TARGET.is_symlink() or TARGET.exists():
                  raise SystemExit('Deployment staging directory already exists; use a clean CI checkout.')
              TARGET.mkdir()
              count = 0
              for entry in ALLOW:
                  source = ROOT / entry
                  if not source.exists(): raise SystemExit(f'Required deployment source missing: {entry}')
                  for path in ([source] if source.is_file() else source.rglob('*')):
                      relative = path.relative_to(ROOT)
                      if path.is_symlink(): raise SystemExit(f'Deployment link blocked: {relative}')
                      if not path.is_file() or excluded(relative): continue
                      destination = TARGET / relative
                      destination.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copyfile(path,destination)
                      count += 1
              for required in ['public/index.php','artisan','vendor/autoload.php','deployment/post-deploy.sh']:
                  if not (TARGET / required).is_file(): raise SystemExit(f'Incomplete deployment package: {required}')
              print(f'Allowlisted web deployment package created: {count} files. No .env, credentials, runtime storage, agent, or operator documents included.')


          if __name__ == '__main__':
              main()
          PY
      - name: Deploy via encrypted FTPS without a third-party action
        env:
          FTP_TLS_SERVER_NAME: ${{ secrets.PROD_FTP_TLS_SERVER_NAME }}
          FTP_SERVER: ${{ secrets.PROD_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import hashlib
          import io
          import json
          import os
          from pathlib import Path, PurePosixPath
          import ssl
          import ipaddress

          # The FTP login is already rooted at prod; never append public/ or a host path.
          root = Path('.deploy').resolve()
          state_name = '.lb-production-python-ftps-state.json'
          host = os.environ['FTP_SERVER'].strip()
          if not host or any(c in host for c in '/\\\r\n\t '):
              raise SystemExit('FTP_SERVER must be the certificate hostname, without a scheme or path')
          tls_name = os.environ.get('FTP_TLS_SERVER_NAME', '').strip() or ('hostgator.com' if host == '192.185.52.143' else host)
          try:
              ipaddress.ip_address(tls_name)
          except ValueError:
              pass
          else:
              raise SystemExit('Set PROD_FTP_SERVER to the certificate hostname, or add PROD_FTP_TLS_SERVER_NAME with that hostname. An IP cannot verify this server certificate.')
          files = sorted(path for path in root.rglob('*') if path.is_file())
          if not files or any(path.is_symlink() for path in root.rglob('*')):
              raise SystemExit('Empty deployment package or symlink detected')
          current = {}
          for path in files:
              relative = path.relative_to(root).as_posix()
              if any(c in relative for c in '\r\n') or '..' in PurePosixPath(relative).parts:
                  raise SystemExit('Unsafe deployment filename')
              current[relative] = hashlib.sha256(path.read_bytes()).hexdigest()

          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=60)
          try:
              ftp.connect(host, 21)
              ftp.host = tls_name  # Verify control and data TLS against the certificate hostname.
              ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
              ftp.prot_p()  # Encrypt data transfers as well as the authenticated control connection.
              remote_root = ftp.pwd()
              # A chroot often reports /, so also detect Laravel's public entry point.
              entries = ftp.nlst()
              if remote_root.rstrip('/').endswith('/public') or any(PurePosixPath(entry).name == 'index.php' for entry in entries):
                  raise SystemExit('FTP account appears rooted at public/. Change its home directory to prod/, keeping the website document root at prod/public/.')
              state = bytearray()
              def collect(chunk):
                  state.extend(chunk)
                  if len(state) > 8 * 1024 * 1024:
                      raise ValueError('Remote deployment inventory exceeds size limit')
              try:
                  ftp.retrbinary('RETR ' + state_name, collect)
              except ftplib.error_perm as error:
                  if not str(error).startswith('550'):
                      raise
              previous = json.loads(state) if state else {}
              if not isinstance(previous, dict):
                  raise ValueError('Invalid remote deployment inventory')
              uploaded = 0
              remote_parent = None
              known_dirs = set()
              for path in files:
                  relative = path.relative_to(root).as_posix()
                  if previous.get(relative) == current[relative]:
                      continue
                  parent = PurePosixPath(relative).parent.as_posix()
                  if parent != remote_parent:
                      ftp.cwd(remote_root)
                      traversed = []
                      for part in PurePosixPath(relative).parts[:-1]:
                          traversed.append(part)
                          directory = '/'.join(traversed)
                          if directory not in known_dirs:
                              try:
                                  ftp.mkd(part)
                              except ftplib.error_perm as error:
                                  if not str(error).startswith('550'):
                                      raise
                              known_dirs.add(directory)
                          ftp.cwd(part)
                      remote_parent = parent
                  with path.open('rb') as handle:
                      ftp.storbinary('STOR ' + path.name, handle, blocksize=262144)
                  uploaded += 1
              ftp.cwd(remote_root)
              inventory = json.dumps(current, sort_keys=True).encode()
              ftp.storbinary('STOR ' + state_name + '.pending', io.BytesIO(inventory))
              ftp.rename(state_name + '.pending', state_name)
              print(f'FTPS upload complete: {uploaded} changed files; {len(files)-uploaded} unchanged. No remote files deleted.')
          finally:
              ftp.close()
          PY
      - name: Record required server activation step
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Upload completed; server activation remains required
          FTPS cannot execute PHP commands. In cPanel Terminal/SSH, from the existing `prod` application directory, run:
          ```bash
          bash deployment/post-deploy.sh
          ```
          This applies additive migrations and refreshes Laravel caches. Preserve the existing `.env`, `APP_KEY`, database, credentials and storage. Never run `migrate:fresh` or seed production demo users.
          The FTP destination was `./` relative to the account already rooted at `.../prod`; the website document root remains `.../prod/public`.
          SUMMARY
