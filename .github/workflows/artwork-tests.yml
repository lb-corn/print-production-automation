name: Artwork matching regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artwork-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PHP tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.3-cli php8.3-mbstring php8.3-sqlite3 php8.3-xml php8.3-curl php8.3-zip composer
          sudo update-alternatives --set php /usr/bin/php8.3
      - name: Install and audit locked dependencies without scripts or plugins
        run: |
          composer --no-plugins --no-scripts validate --no-check-publish
          composer --no-plugins --no-scripts install --no-interaction --prefer-dist --no-progress
          composer --no-plugins --no-scripts audit --locked
      - name: Syntax and isolated regression checks
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array
          LOG_CHANNEL: stderr
        run: |
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          find app routes database/migrations tests -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check public/js/app.js
          php tests/artwork-naming.php
          node tests/artwork-naming-controls.cjs
          php tests/rematch-throttle.php
          node tests/rematch-controls.cjs
          php tests/drive-index.php
          php tests/artwork-matching.php
          php tests/bulk-review.php
          php tests/batch-return.php
          php tests/admin-controls.php
